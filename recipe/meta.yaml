{% set version = "22.1.8" %}

package:
  name: lldb
  version: {{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-{{ version.replace(".rc", "-rc") }}.tar.gz
  sha256: ad18b70e287954c3d62bc7e0b86e7b7af2adf87bcfce21c15fe717f101d7aace
  patches:
    # Fix Python and Mac support
    - patches/0001-Remove-linking-liblldb-to-libpython.patch  # [not win]
    # https://github.com/llvm/llvm-project/issues/59449
    # allows for compiling with older SDKs
    - patches/0002-Define-CPU_SUBTYPE_ARM64E-if-not-available.patch
    # This is needed due to c-f's remove of pid_t in Python: https://github.com/conda-forge/python-feedstock/pull/767
    - patches/0003-Don-t-define-NO_PID_T-where-Python-is-patched.patch  # [win and py>=311]
    - patches/0004-fix-file-extension-on-windows.patch                  # [win]

build:
  number: 1
  python_version_independent: true  # [is_abi3]
  skip: true                        # [is_abi3 and not is_python_min]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - swig                                   # [build_platform != target_platform]
    - zlib                                   # [build_platform != target_platform]
    - llvmdev =={{ version }}                # [build_platform != target_platform]
    - clangdev =={{ version }}               # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake >=3.4.3
    - ninja
  host:
    - python-abi3                   # [is_abi3]
    - python
    - llvmdev =={{ version }}
    - clangdev =={{ version }}
    - llvm =={{ version }}
    - libclang-cpp =={{ version }}
    - swig
    - ncurses  # [not win]
    - libedit  # [not win]
    - libxml2-devel
    - liblzma-devel
    - zlib
    - zstd
    - six
  run:
    - ncurses  # [not win]
    - libedit  # [not win]
    - python
    - six
    # need to add this manually because the bootstrap compiler has no run-export
    - libcxx   # [osx]
  run_constrained:
    - llvmdev =={{ version }}
    - clangdev =={{ version }}

test:
  requires:
    - abi3audit                     # [is_abi3]
  imports:
    - lldb
  commands:
    - lldb --version
    - abi3audit $SP_DIR/lldb/native/_lldb.abi3.so -s -v --assume-minimum-abi3 {{ python_min }}      # [unix and is_abi3]
    - abi3audit %SP_DIR%/lldb/native/_lldb.abi3.pyd -s -v --assume-minimum-abi3 {{ python_min }}    # [win and is_abi3]


about:
  home: http://llvm.org/
  dev_url: https://github.com/llvm/llvm-project
  license: Apache-2.0 WITH LLVM-exception
  license_file: lldb/LICENSE.TXT
  summary: The LLVM Debugger

extra:
  recipe-maintainers:
    - isuruf
    - h-vetinari
    - xhochy
